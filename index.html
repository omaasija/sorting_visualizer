<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Sorting Visualizer</title>
  </head>
  <body>
    <div class="container">
      <div class="bars_container" id="bars_container"></div>

      <div class="controllers">
        <!-- <label for="slider">Array Size:</label> -->
        <label for="slider">Array Size: <span id="sliderValue">50</span></label>
        <br />
        <input
          type="range"
          id="slider"
          min="50"
          max="150"
          step="6"
          value="50"
        />

        <select name="" id="speed">
          <option value="100">Slow</option>
          <option value="50">Medium</option>
          <option value="10">Fast</option>
        </select>

        <select name="" id="algo">
          <option value="bubble">Bubble Sort</option>
          <option value="insertion">Insertion Sort</option>
          <option value="heap">Heap Sort</option>
          <option value="merge">Merge Sort</option>
          <option value="quick">Quick Sort</option>
          <option value="selection">Selection Sort</option>
        </select>

        <!-- <select name="" id="array_size">
          <option value="20">size 20</option>
          <option value="50">size 50</option>
          <option value="100">size 100</option>
        </select> -->

        <button id="start_btn">Start</button>
        <button id="stop_btn">Stop</button>
        <button id="reset_btn">Reset</button>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
